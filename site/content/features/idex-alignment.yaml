#
# The interactive IDEX alignment card (pages/idex-alignment-scorecard.yaml):
# the rules printed on page 1, the diagnosis text of each fitted term, and
# the station read positions of every bed preset.
#
# Aligned with the test definition v1.0.0: suite/definitions/idex_alignment.toml
# ([analysis], [[diagnosis]], [beds]) and suite/tests/idex_alignment.py
# (build_layout, fit_plane, analyze), mirrored in docs/dev/idex-alignment-features.md.
# The card's JavaScript (sitegen/render.py, IDEX_FIT) is a port of `analyze()`:
# per axis, least squares reading = c0 + cx*x + cy*y over the stations, x and y
# in mm from the bed centre. Thresholds: ok below 0.05 mm or within 2 standard
# errors (floor 0.025 mm per reading), watch 0.05-0.10, fix above 0.10, judged
# by the effect at the outer stations; residual above 0.10 mm = re-read.
#
# `scoring: idex` switches the scorecard to this mode. The `features` are the
# fitted terms (ids = the analyzer's term names, also the PO contexts: keep them).
status: "IDEX alignment v1.0.0"
scoring: idex

title: "IDEX alignment card"
intro: "One row per station, X and Y readings in mm."
rule_title: "How the card works"
rules:
  - "Choose the **bed preset** of the file you printed and the **test** (Vernier or Lite). The card knows where every station sits on each published bed preset."
  - "Read every station **on the bed, before removing the print**. Stations are numbered like a phone keypad **seen from the front**: 1 back-left, 5 centre, 9 front-right."
  - "**Vernier:** write the **fine** reading in mm with its sign: a labelled tick is that many tenths (\"2\" = 0.20), the unlabelled tick just beyond a label adds 0.05, and a reading on the **\"+\" side** is positive. Fill the **coarse** box only when the coarse scale reads 6, 8 or 10, or when the fine scale has no clear alignment: the card then picks the right repeat of the fine scale."
  - "**Lite:** type **+** when T1 moved towards + (X: gap on the left, overlap on the right; Y: gap at the front, overlap at the back), **−** for the opposite, **0** when both contact lines look the same. Lite gives a sign pattern only, no numbers."
  - "The card fits a plane through the readings of each axis, **reading = c0 + cx·x + cy·y**, with x and y in mm from the bed centre. c0 is the tool offset at the bed centre; the slopes show the mechanics."
  - "Each slope is judged by its **effect at the outer stations**: **ok** below 0.05 mm (one fine step) or within the reading noise, **watch** from 0.05 to 0.10 mm, **fix** above 0.10 mm. The offset is either ok (below 0.05 mm) or worth applying."
  - "A station more than **0.10 mm off the plane** is flagged: re-read it with a loupe before trusting the result."
  - "**Fix the mechanics first** (any slope marked fix), print again, then set the offset. Every correction is **new = old + reading**. On RatOS, do the [sign check](page:idex-alignment#sign-check) once before trusting it."

# The fitted terms, in the analyzer's order (idex_alignment.toml [[diagnosis]]).
features:
  - id: x0
    name: "X offset"
    pattern: "Same X reading at every station"
    cause: "Plain X tool offset"
    action: "Apply the X correction below (new = old + reading)."
  - id: y0
    name: "Y offset"
    pattern: "Same Y reading at every station"
    cause: "Plain Y tool offset"
    action: "Apply the Y correction below (new = old + reading)."
  - id: dx_dx
    name: "X scale (X reading changes from left to right)"
    pattern: "X reading changes from left to right"
    cause: "The two carriages travel different distances in X: belt tension or pitch, a pulley, or the X `rotation_distance` of one carriage."
    action: "Check both X belts (same tension, same belt), the pulley set screws and the motor mounts. If T0 measures right on a dimensional test, set T1's rotation_distance to old × (1 + slope)."
  - id: dy_dx
    name: "Rails or gantry (Y reading changes from left to right)"
    pattern: "Y reading changes from left to right"
    cause: "T1's X travel is not parallel to T0's: carriage rails not parallel, or gantry twist or flex that depends on where the parked carriage sits."
    action: "Check that the X rail(s) are straight and bolted down, and that the gantry is not twisted. A pure rotation can also be a loose toolhead mount."
    vc4: "**RatRig V-Core 4/4.1 IDEX** (field experience, the author's own printer): a Y gap that grows across the bed was fixed by making the two toolhead belts the **same length**. Count the teeth, or compare the belt ends at the clamps: 1–2 teeth of difference are enough. Re-tension both equally, then print the Vernier again to confirm."
  - id: dx_dy
    name: "Racking (X reading changes from front to back)"
    pattern: "X reading changes from front to back"
    cause: "Yaw or racking of the gantry as it moves in Y, seen differently by the two carriages."
    action: "Square the gantry on both Y sides, compare the left and right Y belt tension, and check the gantry joints."
  - id: dy_dy
    name: "Y scale (Y reading changes from front to back)"
    pattern: "Y reading changes from front to back"
    cause: "Rare with a shared Y gantry: usually a misreading, a loose nozzle or hotend, or the bed moving between the two tools."
    action: "Re-read the stations; check that both hotends and the bed are rigid."
    vc4: "**RatRig V-Core 4/4.1 IDEX:** the same belt-length check as for a Y reading that changes from left to right can apply here (field experience, the author's own printer)."
  - id: residual
    name: "One station off the plane"
    pattern: "One station disagrees with the plane through the others"
    cause: "A misreading, a bad first layer at that spot (bed mesh), or local backlash."
    action: "Re-read that station with a loupe; if it persists, check the bed mesh and the carriage there."

