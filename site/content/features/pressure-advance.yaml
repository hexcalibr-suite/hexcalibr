#
# The probes of each pressure-advance band, and how to score them.
# ONE source for two places: the "How to read it" steps of
# pages/pressure-advance.yaml (one step per feature) and the printable
# scorecard (pages/pressure-advance-scorecard.yaml, one column per feature).
#
# Aligned with the test definition v1.3.0 (hex pinwheel; v1.2.1: the inside
# corners have weight "confirms", shown but never counted, and the convex
# probes lead the reading; v1.3: a coarse and a fine file per preset):
# suite/definitions/pressure_advance.toml ([[features]], [presets]), mirrored
# in docs/dev/pressure-advance-features.md. Same ids, same order. If the TOML
# changes, change this file (ids are also the PO contexts and the page
# anchors: keep them stable). Seen with the engraved band numbers facing you.
#
# `scoring: bands` switches the scorecard to the pressure-advance mode:
# states pass / L (PA too low) / H (PA too high) / not scored, a PA value
# per band filled in from the firmware preset, and the decision rule below.
status: "pressure advance v1.3.0 (hex pinwheel, coarse and fine)"
scoring: bands

title: "Pressure advance scorecard"
intro: "One row per band, one column per probe."
rule_title: "How the best band is chosen"
rules:
  - "Hold the tower with the engraved band numbers facing you. Score each band on its own, **in its middle**, away from the divider groove: **✓** pass, **L** fails because PA is too low (bulge, blob, filled corner), **H** fails because PA is too high (rounded, gap, slit), **–** cannot judge."
  - "Go up from band 1. A band **qualifies** when both **90° tips** are ✓ and **no counted probe** is H. The **Inside** column is not counted: a concave corner is rounded by the bead width in every band, so do not judge PA there."
  - "Your value is the **lowest band that qualifies**. The 45° tip may still be L there: that is normal."
  - "**Tie:** if the band just above also qualifies and has at least as many ✓, take that **higher** band (when in doubt, lean higher)."
  - "If the result is **band 1 or the top band**, the range is wrong: print a tower with the range shifted that way."
  - "**Sanity check:** L marks belong at the bottom (low PA) and H marks at the top. Marks scattered at random, or L and H on the same probe of one band, point to something else: see [Troubleshooting](page:pressure-advance#troubleshooting)."

# For the scorecard's firmware menu: band 1 (bottom, always PA 0) first,
# nine bands (pressure_advance.toml [presets], 0.4 mm nozzle), the coarse and
# the fine file of each preset. `firmware` is the calib.py family, `preset`
# and `variant` pick the next-pass command (--preset P --centre V).
blocks_max: 9
presets:
