#
# Test F4 on this site, flow / extrusion multiplier (hexcalibr-core v0.6.0: 7 hexagonal pads in a
# staircase, each pad's top skin at its own universal M221; coarse 91-109 / 3, one fine file per
# coarse pad at 1 %). Facts come from suite/definitions/flow_ratio.toml and suite/tests/flow_ratio.py
# (hexcalibr-core). Photos: the owner's coarse PETG print on the VC4, T0 (2026-10-11) and the check print at EM 0.88
# (2026-10-12); measured print time 31 min.
id: flow
title: "Flow (extrusion multiplier)"
nav_title: "Flow (extrusion multiplier)"
description: "Find the extrusion multiplier that fills top surfaces without gaps or ridges: seven hexagonal pads in a staircase, each printed at a different flow, then a fine pass around the best one."
numbered: true
intro: |
  Seven hexagonal pads in a row, each one step taller than the one before. The top of every pad is printed with a slightly different amount of plastic, from 91 % to 109 %. Look at the tops with a low light, pick the smoothest one with no gaps and no ridges, then print the fine file for that pad: seven more pads, 1 % apart. The best one gives your new extrusion multiplier.

  About 8 g of filament and **about 30 minutes** per print, with **no changes to your profiles**.
more:
  intro: |
    PrusaSlicer has no flow setting per object, so the file sends a flow factor (`M221`) at the layer where each pad's top begins: the four top layers of pad 1 print at 91 %, those of pad 2 at 94 %, and so on. The pads below and above share those layers, but only their hidden insides. The file also fixes the speed of the pads at 60 mm/s, so every top is printed the same way, and puts everything back to 100 % at the end.
callouts:
  - kind: warn
    text: "Open the file with **File › Open project**. Never with **Import**, never as a ZIP: an import keeps the shape but drops the flow factors, and every pad would print the same."
need:
  title: "What you need"
  columns:
    - title: "To print"
      items:
        - "The [coarse file](page:flow#which-file), then one fine file"
        - "PrusaSlicer 2.9 (2.7 is the minimum that opens the project)"
        - "Your own printer, print and filament profiles, already working"
        - "The [first layer](page:first-layer), the [temperature](page:temperature-tower) and the [pressure advance](page:pressure-advance) already set"
        - "The filament to test, **dry**: about 8 g per print"
        - "A bed at least **180 mm** wide"
    - title: "To read it"
      items:
        - "A lamp you can move, or a phone torch"
        - "A fingernail"
        - "The [selector on this page](page:flow#choose)"

steps:
  - part: "Before printing"

  - id: what-for
    title: "What it is for, and when to run it"
    points:
      - "It finds the **extrusion multiplier** of a filament: how much plastic PrusaSlicer asks for, so that solid layers are full without being overfilled."
      - "Run it **after pressure advance**, once per filament (and per nozzle). The result goes into **Filament Settings › Filament › Extrusion multiplier**."
    photos:
      - id: F4_overview_PETG_VC4
        alt: "The coarse flow test printed: seven hexagonal pads in a staircase on a thin strip with the numbers 1 to 7"
        caption: "The coarse print in PETG: from pad 1 (91 %) to pad 7 (109 %). The top lines run the same way on every pad; the low rim on pad 7 is where the file puts flow and speed back to 100 %."
        aspect: "3/1"
        shot: "DONE: _A645991 (2026-10-11), the owner's coarse PETG print (v0.6.0, T0), from above, raking light from the top, dark background; cropped 3:1."
    more:
      points:
        - "Too little plastic leaves **gaps** between the top lines and weak walls; too much makes **ridges**, rough tops, blobs and parts that come out slightly too big."
        - "Read it on **top surfaces**, not by measuring a wall with a caliper: a wall wobbles a little, so it always measures too thick, and 0.02 mm already means 5 %. That is why this test reads tops, as Ellis' guide recommends."
        - "It comes **after pressure advance**: PA changes how the line starts and ends, which shows on the tops."
        - beginner: "The multiplier is a correction on top of the filament diameter. Most filaments land between 0.92 and 1.05."

  - id: which-file
    title: "Which file"
    printables: printables-flow
    table:
      head: ["File", "Pads", "When"]
      rows:
        - ["`flow_coarse_91-109.3mf`", "91, 94, 97, 100, 103, 106, 109 %", "First: finds the zone"]
        - ["`flow_fine_<from>-<to>.3mf`", "7 pads, 1 % apart, centred on one coarse pad", "Second: the one for your best coarse pad (the [selector](page:flow#choose) names it)"]
    points:
      - "There are seven fine files, one for each coarse pad: `88-94`, `91-97`, `94-100`, `97-103`, `100-106`, `103-109`, `106-112`. Print only the one the selector gives you."
    more:
      points:
        - "The fine file covers ±3 % around the coarse pad you chose. The coarse step is 3 %, so the right value is always within that range."
        - "Every file is 150 × 30 mm and about 8 mm tall: it fits any bed from 180 mm."
        - expert: "On an IDEX or multi-tool printer, assign the object to the tool you calibrate (right-click › Change extruder). The multiplier belongs to the filament profile of that tool."

  - id: before-print
    title: "Before you start"
    points:
      - "**Write down the extrusion multiplier** in your filament profile (**Filament Settings › Filament**). You need it at the end."
      - "Nothing else to change: layer height, speed and flow are set by the file for the pads only."
    more:
      points:
        - "The layer height is forced to **0.2 mm** (half the nozzle): the file must know where each pad's top begins."
        - "The pads print at **60 mm/s**, every line, as Ellis' guide recommends for this test. The slicer sees a slow print and never slows the small top pads down; a speed factor (`M220`) brings them to 60 mm/s."
        - "The narrow raised strip at the back of pad 7 is not a pad: its last layers put the flow and the speed back to 100 % and show the end message."
        - "**If you cancel the print**, send `M221 S100` and `M220 S100` from the console before the next print."

  - part: "Print and read"

  - id: open
    title: "Open, slice and print"
    points:
      - "**File › Open project**, then **Slice now**. In the preview the pads rise one step each, from 1 on the left to 7 on the right."
      - "Print the coarse file. Do not touch speed or flow while it prints."

  - id: read
    title: "Read the tops"
    points:
      - "Hold a light low, raking across the top lines, and look at the **middle** of each pad."
      - "**Too little:** gaps or dark grooves between the lines; you may see the infill through them."
      - "**Right:** lines joined with no gaps, a flat, even top; the lines are still faintly visible, and you can still feel them with a fingernail."
      - "**Too much:** ridges (lines standing higher than their neighbours), a rough top that catches your fingernail, plastic piled up at the edges."
      - "If two pads look alike, **run a fingernail across the lines** of both: keep the one where it glides evenly, without dropping into grooves or catching on a raised line."
      - "If they still feel equally good, **take the higher one**: a little too much is better than a little too little."
    photos:
      - id: F4_compare_PETG_VC4
        alt: "Pads 1, 4 and 7 of the same coarse print side by side under the same raking light: deep dark grooves between the lines on pad 1, an even top with faint lines on pad 4, raised, separate lines on pad 7"
        caption: "Pads 1 (91 %), 4 (100 %) and 7 (109 %), same photo, same light. Pad 1: dark grooves between the lines. Pad 4: the lines close up into an even top. Pad 7: too much plastic, so each line stands up as a ridge."
        aspect: "3/1"
        shot: "DONE: three crops from the same photo _A645991 (2026-10-11), so light and scale match; each crop keeps the pad's number (owner, 2026-10-12). The close-ups _A645992-96 have a different light per shot: do not mix them in one comparison."
    more:
      points:
        - misread: "**The edges always look fuller**: the perimeters and the turnarounds of the top lines add plastic there. Judge the middle."
        - misread: "**A glossy, perfectly smooth top** can be too much: look for the faint lines, and for ridges under a fingernail."
        - misread: "**You can feel lines on every pad**, even the best one: that is the shape of each printed line, not a flow error. The multiplier only makes the lines even; for a truly smooth top, turn on ironing (**Print Settings › Infill › Ironing**, expert mode) on the parts that need it."
        - misread: "**Gaps only on one side of each line**, or rough patches that move from pad to pad: wet filament or a worn nozzle, not the multiplier."
        - "Pad 1 is the lowest and pad 7 the highest, but every top is the same: four layers over sparse infill, with the lines running the same way on every pad. The height does not change the reading."

  - id: choose
    title: "Choose the fine file, then the new value"
    points:
      - "Tick the best pad of the coarse print: the selector names the fine file to print."
      - "Print it, read it the same way, tick its best pad and type the extrusion multiplier your profile has now: the selector gives the new value."
    flowpick:
      coarse: [91, 94, 97, 100, 103, 106, 109]
      half: 3
      step: 1
      pattern: "flow_fine_{a}-{b}.3mf"
    more:
      points:
        - "New multiplier = the multiplier now × the best pad's percent ÷ 100. Example: 0.98 now, best pad 96 % → 0.98 × 0.96 = 0.94."

  - id: save
    title: "Save the value"
    points:
      - "Type the new value into **Filament Settings › Filament › Extrusion multiplier** and **save the filament preset** (the disk icon)."
      - "Print the fine file `flow_fine_97-103` once more if you want to check it: pad 4 (100 %) should now look best."
    photos:
      - id: F4_verify-pad4_PETG_VC4
        alt: "Close-up of pad 4 of the check print flow_fine_97-103 after saving the new multiplier: the top lines are joined into a flat, even surface, still faintly visible, with no gaps and no raised lines"
        caption: "The check print `flow_fine_97-103` after saving the new value (PETG, 0.85 → 0.88): pad 4 (100 %) is the best one. Lines joined, no grooves, none standing up; you still see and feel them."
        aspect: "4/3"
        shot: "DONE: crop of _A646001 (2026-10-12), the owner's check print at EM 0.88 (v0.6.0, T0), pads 4-6 in one shot; the owner picked pad 4 by fingernail."
    more:
      points:
        - "The value belongs to this filament on this nozzle. A new spool of the same filament usually keeps it; a different brand or colour can differ by a few percent."
        - "If you later change the nozzle or the hotend, run it again."
