id: home
title: "Calibrate your printer and filaments in PrusaSlicer"
nav_title: "Overview"
description: "Ready-made PrusaSlicer test projects with step-by-step guides: what to print, how to read it, which setting to change."
show_tests: true
intro: |
  {suite} is a set of small calibration tests that you open in **PrusaSlicer** and print with your own profiles. Every test comes with a guide like this one: how to print it, how to read it, block by block, and which setting to change afterwards.
more:
  intro: |
    It is meant for everyone: the beginner who just wants a filament to print well, and the expert who wants to know what each test really measures. Klipper, Marlin and Prusa printers, single tool and IDEX.
callouts:
  - kind: warn
    text: "Open every test with **File › Open project** (Ctrl+O / ⌘O). **Never with Import**, and never \"Import 3D models only\" when you drop a file on PrusaSlicer: the shape loads, but the temperature or speed changes that make it a test are silently dropped. Download the single .3mf, not a ZIP."
steps:
  - id: release-1
    title: "What's in release 1"
    intro: "The first public release has four tests. Each comes with a guide, a scorecard and its files on Printables."
    points:
      - "[Temperature tower](page:temperature-tower): the nozzle temperature for a filament. [Files on Printables](link:printables-temperature-tower)"
      - "[Maximum volumetric flow](page:max-flow): how much plastic per second your hotend can melt. [Files on Printables](link:printables-max-flow)"
      - "[Pressure advance](page:pressure-advance): sharp corners and even walls, per filament and firmware. [Files on Printables](link:printables-pressure-advance)"
      - "[IDEX and multi-tool alignment](page:idex-alignment): the XY offset between two toolheads, over the whole bed. [Files on Printables](link:printables-idex-alignment)"
      - "**Coming next:** first layer and Z offset, flow (extrusion multiplier), retraction, and dimensions and fit. They are listed in grey in the contents."
      - "The files are updated often: download them from Printables, not from a re-upload, to get the latest version."
    printables: printables-collection
  - id: what-it-is
    title: "What the suite is"
    points:
      - "Each test is a **PrusaSlicer project (.3mf)**: the test object plus the changes it makes while printing (for example a new temperature at every block)."
      - "The projects contain **no printer, filament or print profile**. PrusaSlicer keeps yours, so the test prints the way your real parts print."
      - "Made for PrusaSlicer 2.9 (2.7 is the minimum). For PrusaSlicer 3.x the tests will be prepared as Lua plugins, once its plugin system is stable."
    photos:
      - id: V0_howto-open-print_PS29
        kind: video
        alt: "Screen recording: a HexCalibr test downloaded, opened as a project in PrusaSlicer, checked in the preview and sent to the printer"
        caption: "One minute, start to finish: download, File › Open project, check the markers, slice, print."
        shot: "VIDEO, screen recording, no text overlay, no voice. See docs/media/video-come-funziona.md in the workspace: Printables download → File › Open project (no preset dialog) → preview markers with the M104 tooltip → Slice → Send to printer → print starting in Mainsail. 45–60 s, PrusaSlicer light theme, English UI, about 1600×1000, no personal data on screen. Or set youtube: <id> for the promo version."
    more:
      points:
        - "The tests are small on purpose: a few grams each, with one variable per test. Big \"torture tests\" fail for ten reasons at once and teach nothing."
        - "Every guide tells you **what to look at**, with photos of a failed and a good result, and **which PrusaSlicer setting to change**."
  - id: fast-or-full
    title: "Fast path or full path"
    table:
      head: ["", "Fast path", "Full path"]
      rows:
        - ["When", "A new filament on a printer that already prints well", "A new printer, or after changing hotend, extruder or other hardware"]
        - ["Tests", "Temperature (if the filament is new to you, prints fast or strings) → pressure advance → flow", "Firmware checks → first layer → temperature → max volumetric flow → pressure advance → flow → retraction → dimensions; then the IDEX tests"]
        - ["Time", "About 35 minutes of printing for the tests available now (temperature and pressure advance)", "Each guide gives the time of its test, plus waiting"]
        - ["Filament", "About 15 g", "Each guide gives the grams of its test"]
    more:
      points:
      - "**Firmware checks** are not printed tests: belts, PID tuning, extruder steps (rotation distance) and input shaping are done with your firmware's own tools. Do them before the first layer."
      - "On an IDEX or multi-tool printer, calibrate each tool's filament on that tool, or at least on the tool you will use."
  - id: order
    title: "Why this order"
    points:
      - "Follow the contents from top to bottom: each test builds on the ones before it."
    more:
      points:
      - "**First layer first:** every other test sits on it."
      - "**Temperature before everything else for a filament:** flow, pressure advance and retraction all change with temperature."
      - "**Maximum volumetric flow before pressure advance:** pressure advance is calibrated at speeds the hotend can really melt."
      - "**Pressure advance before flow:** the flow test reads top surfaces, which pressure advance changes."
      - "**Retraction last:** good pressure advance often removes most stringing by itself."
      - "The tests not written yet are listed in grey: they arrive one at a time."
